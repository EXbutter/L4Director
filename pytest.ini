[pytest]
; 后端测试：backend/tests（白盒单元 + 路由契约 + 性能预算）
; 运行：pytest            —— 全部
;       pytest -m "not perf"  —— 跳过性能预算（CI 弱机器上更快）
;       pytest -m perf        —— 只跑性能预算
testpaths = backend/tests
pythonpath = backend
addopts = -q --strict-markers
markers =
    perf: 性能预算用例（有绝对耗时上限，弱机器上可能抖动）
    slow: 生成上百个合成 VPK 的用例（十几秒级）
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
